<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18">
<title>AI Video Studio</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111827;--line:#263247;--muted:#91a0b8;--accent:#8d7cff;--text:#f2f4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 18% 0,#1b2240 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{height:68px;padding:0 max(22px,calc((100vw - 1180px)/2));border-bottom:1px solid #222b3c;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;font-size:19px}.brand b{color:#a397ff;margin-right:8px}.badge{color:#b4aaff;background:#25223c;border:1px solid #403a66;border-radius:20px;padding:5px 10px;font-size:12px}.wrap{max-width:1180px;margin:32px auto;padding:0 20px;display:grid;grid-template-columns:minmax(320px,.9fr) minmax(390px,1.1fr);gap:20px}.card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 16px 55px #0003}.eyebrow{font-size:11px;letter-spacing:.18em;color:#9aa8c0;font-weight:800}h1{font-size:27px;margin:7px 0 23px}h2{font-size:19px;margin:5px 0}label{display:block;color:#bbc5d8;font-size:13px;margin:0 0 8px}textarea{width:100%;height:145px;resize:vertical;border-radius:10px;border:1px solid #334056;background:#0b1120;color:var(--text);padding:13px;font:15px/1.6 inherit;outline:none}textarea:focus{border-color:var(--accent)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.ratios{display:flex;gap:7px}.ratios button{flex:1;padding:9px 5px;border:1px solid #344057;border-radius:8px;background:#0d1423;color:#b9c3d6;cursor:pointer}.ratios button.selected{border-color:#9b8cff;background:#282443;color:white}input[type=range]{width:100%;accent-color:var(--accent)}.range-label{display:flex;justify-content:space-between}.primary{width:100%;padding:13px;margin-top:22px;border:0;border-radius:9px;color:white;font-weight:750;font-size:15px;background:linear-gradient(120deg,#7568e9,#9b72ec);cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.notice{font-size:12px;color:#99a7bd;background:#0b1220;border:1px solid #263247;border-radius:9px;padding:11px;margin-top:14px}.queue-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.count{font-size:12px;color:var(--muted)}.jobs{display:grid;gap:10px}.job{display:grid;grid-template-columns:138px 1fr;gap:13px;padding:9px;border:1px solid #263247;border-radius:11px;background:#0c1321}.preview{width:138px;height:80px;border-radius:7px;background:linear-gradient(135deg,#252441,#152e39);display:grid;place-items:center;color:#c2b9ff;font-size:12px;overflow:hidden}.preview video{width:100%;height:100%;object-fit:cover}.job h3{margin:3px 0 4px;font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:var(--muted)}.bar{height:4px;background:#263247;border-radius:5px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:#9887ff;transition:width .3s}.empty{text-align:center;color:#7e8ba2;padding:75px 10px}.empty strong{display:block;color:#b4aaff;font-size:30px;margin-bottom:8px}.job-actions{display:flex;gap:12px;margin-top:6px}.job-actions button{background:none;border:0;padding:0;color:#baafff;font-size:12px;cursor:pointer}.footer{max-width:1180px;margin:-5px auto 28px;padding:0 20px;color:#76839a;font-size:12px}@media(max-width:820px){.wrap{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}@media(max-width:480px){.card{padding:18px}.job{grid-template-columns:100px 1fr}.preview{width:100px;height:70px}.controls{grid-template-columns:1fr}.wrap{padding:0 12px;margin-top:18px}}
</style>
</head>
<body>
<header><div class="brand"><b>◈</b>AI Video Studio</div><span class="badge">单文件体验版</span></header>
<main class="wrap">
<section class="card"><div class="eyebrow">CREATE</div><h1>创作新视频</h1>
<form id="form"><label for="prompt">描述你想生成的视频</label><textarea id="prompt" required maxlength="1000">一只宇航员猫在月球上慢慢走过闪烁的星河，电影感，柔和光线</textarea>
<div class="controls"><div><label>画幅比例</label><div class="ratios"><button type="button" class="selected" data-ratio="16:9">16:9</button><button type="button" data-ratio="9:16">9:16</button><button type="button" data-ratio="1:1">1:1</button></div></div><div><label class="range-label">视频时长 <span><b id="durationText">5</b> 秒</span></label><input id="duration" type="range" min="1" max="60" value="5"></div></div>
<button class="primary" id="submit">✦ 创建演示任务</button></form>
<div class="notice"><b>体验版说明：</b>此文件可以直接打开，任务进度和示例视频仅用于演示界面，不会调用 AI 模型生成新视频。真实生成需要接入视频服务及其 API 凭据。</div>
</section>
<section class="card"><div class="queue-head"><div><div class="eyebrow">QUEUE</div><h2>生成任务</h2></div><span class="count" id="count">0 个任务</span></div><div class="jobs" id="jobs"></div></section>
</main><div class="footer">任务记录保存在此浏览器中。清除浏览器数据会移除记录。</div>
<script>
(()=>{'use strict';const video='https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';const $=s=>document.querySelector(s);let ratio='16:9';let jobs=[];try{jobs=JSON.parse(localStorage.getItem('aivs-jobs')||'[]')}catch{};$('#duration').addEventListener('input',e=>$('#durationText').textContent=e.target.value);document.querySelectorAll('[data-ratio]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');ratio=b.dataset.ratio}));function save(){try{localStorage.setItem('aivs-jobs',JSON.stringify(jobs.slice(0,30)))}catch{};render()}function render(){const root=$('#jobs');$('#count').textContent=jobs.length+' 个任务';if(!jobs.length){root.innerHTML='<div class="empty"><strong>✦</strong>还没有任务，创建一个演示任务吧</div>';return}root.innerHTML=jobs.map(j=>`<article class="job"><div class="preview">${j.status==='completed'?`<video controls preload="metadata" src="${video}"></video>`:`${j.status==='generating'?j.progress+'%':'排队中'}`}</div><div><h3 title="${escapeHtml(j.prompt)}">${escapeHtml(j.prompt)}</h3><div class="meta">${j.ratio} · ${j.duration} 秒 · ${j.status==='completed'?'演示完成':'演示处理中'}</div>${j.status!=='completed'?`<div class="bar"><i style="width:${j.progress}%"></i></div>`:`<div class="job-actions"><button data-play="${j.id}">播放示例视频</button><button data-delete="${j.id}">删除</button></div>`}</div></article>`).join('');root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{jobs=jobs.filter(j=>j.id!==b.dataset.delete);save()})}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#form').addEventListener('submit',e=>{e.preventDefault();const prompt=$('#prompt').value.trim();if(!prompt)return;const job={id:Date.now().toString(),prompt,ratio,duration:Number($('#duration').value),status:'generating',progress:0};jobs.unshift(job);save();$('#submit').disabled=true;$('#submit').textContent='正在创建演示任务…';let p=0;const timer=setInterval(()=>{p=Math.min(100,p+10);job.progress=p;if(p>=100){clearInterval(timer);job.status='completed';$('#submit').disabled=false;$('#submit').textContent='✦ 创建演示任务'}save()},280)});render()})();
</script></body></html>
