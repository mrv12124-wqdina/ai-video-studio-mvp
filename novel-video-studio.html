<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说短片工坊</title>
<meta name="theme-color" content="#090c16">
<style>
:root{color-scheme:dark;--bg:#090c16;--panel:#111625;--panel2:#0c1120;--line:#29344a;--text:#f3f5fb;--muted:#9aa8bf;--purple:#9c86ff;--cyan:#65d5cd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#1b2242 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{height:66px;border-bottom:1px solid #222b3d;padding:0 24px;display:flex;align-items:center;justify-content:center;justify-content:space-between}.brand{font-weight:800}.brand b{color:var(--purple);margin-right:8px}.badge{color:#bfc7d8;border:1px solid #354158;border-radius:20px;padding:5px 10px;font-size:11px}.shell{max-width:1500px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:390px 1fr;gap:14px}.panel{background:rgba(17,22,37,.97);border:1px solid var(--line);border-radius:13px;padding:16px}.steps{display:flex;gap:7px;margin-bottom:14px}.step{flex:1;text-align:center;padding:7px 3px;border:1px solid #303b51;border-radius:7px;color:#8997ae;font-size:11px}.step.active{border-color:#7569bb;background:#25233e;color:#eeeaff}.eyebrow{font-size:10px;color:#9aa8be;letter-spacing:.15em;font-weight:800}.heading{font-size:18px;margin:5px 0 13px}label{display:block;color:#bec8d9;font-size:12px;margin:0 0 6px}.field{margin-bottom:11px}textarea,input[type=text],input[type=number],select{width:100%;border:1px solid #344158;border-radius:8px;background:#0a1020;color:var(--text);padding:9px;outline:none;font:inherit}textarea{resize:vertical}input[type=file]{width:100%;font-size:12px}.novel{height:190px;font-size:13px}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:1px solid #3a465e;background:#1a2335;color:#eef1fb;border-radius:8px;padding:9px 10px;font:inherit;cursor:pointer}.btn.primary{border:0;background:linear-gradient(120deg,#7568e9,#9d72ec);font-weight:750}.btn:disabled{opacity:.55}.btns{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:11px;color:#93a0b7;line-height:1.6}.notice{border:1px solid #514b31;background:#282318;color:#e7d69e;border-radius:8px;padding:9px;font-size:11px;line-height:1.55}.right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px}.preview{padding:12px}.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.stage{aspect-ratio:16/9;width:100%;max-height:58vh;margin:auto;background:#080d18;border-radius:9px;overflow:hidden;display:grid;place-items:center}.stage canvas{width:100%;height:100%;object-fit:contain}.controls{display:flex;align-items:center;gap:7px;margin-top:9px}.controls .btn.primary{margin-left:auto}.meter{height:4px;border-radius:4px;background:#263147;overflow:hidden;flex:1}.meter i{display:block;height:100%;width:0;background:var(--purple)}.chapters{min-height:230px}.chap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.list{display:grid;gap:7px;max-height:295px;overflow:auto}.chapter{display:grid;grid-template-columns:56px 1fr auto;gap:9px;align-items:center;border:1px solid #2a354b;border-radius:8px;background:#0b1120;padding:8px}.chapter.active{border-color:#7569bc}.num{width:42px;height:42px;border-radius:7px;display:grid;place-items:center;background:#20284a;color:#b7adff;font-weight:800}.chapter input{width:100%;border:0;background:transparent;color:var(--text);font:inherit;outline:none}.chapter small{display:block;color:#91a0b7;margin-top:3px}.trash{border:0;background:transparent;color:#d19a9a;cursor:pointer}.workspace{display:grid;grid-template-columns:1fr 280px;gap:10px}.card{border:1px solid #29364d;border-radius:9px;background:#0b1120;padding:10px}.character-list{display:grid;gap:7px}.character{display:grid;grid-template-columns:38px 1fr;gap:7px;align-items:center}.face{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#252640;font-size:20px}.character input{width:100%;border:1px solid #303c52;border-radius:6px;background:#111725;color:white;padding:6px}.
modal{position:fixed;inset:0;background:#03050bdd;display:none;place-items:center;z-index:20}.modal.show{display:grid}.dialog{width:min(720px,calc(100vw - 30px));max-height:90vh;overflow:auto}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.hide{display:none!important}@media(max-width:1050px){.shell{grid-template-columns:330px 1fr}.workspace{grid-template-columns:1fr}}@media(max-width:820px){.shell{grid-template-columns:1fr}.right{min-width:0}.workspace{grid-template-columns:1fr}.steps{overflow:auto}.step{min-width:78px}}@media(max-width:500px){header{padding:0 12px}.shell{padding:0 8px}.panel{padding:12px}.badge{display:none}}
</style>
</head>
<body>
<header><div class="brand"><b>◈</b>小说短片工坊</div><span class="badge">自主分章 · 分镜 · 字幕 · 配音 · 导出</span></header>
<main class="shell">
<aside>
<div class="panel"><div class="steps"><div class="step active">1 小说文本</div><div class="step">2 分镜人物</div><div class="step">3 成片导出</div></div>
<div class="eyebrow">项目设置</div><h2 class="heading">导入小说并生成连续短剧</h2>
<div class="field"><label for="project">作品名称</label><input id="project" type="text" value="未命名小说短剧" maxlength="80"></div>
<div class="field"><label for="novel">粘贴小说正文（支持章节标题、段落和对话）</label><textarea id="novel" class="novel">第一章：城市的雨
深夜，林岚独自走进一条陌生街巷。雨水映着霓虹，远处传来一声轻响。
“有人吗？”她停下脚步，抬头望向漆黑的公寓窗口。
一个温柔却陌生的声音从雨中传来：若想知道真相，就到明日的钟楼来。
第二章：钟楼之约
黎明前，钟楼被浓雾笼罩。林岚握紧手中的旧照片，照片上是十年前失踪的父亲。
钟声响起，她看见远处有一位戴帽子的男子正朝她挥手。</textarea></div>
<div class="row"><div class="field"><label for="chapterSize">每集目标字数</label><input id="chapterSize" type="number" min="300" max="3000" value="900"></div><div class="field"><label for="sceneSize">镜头字数</label><input id="sceneSize" type="number" min="20" max="180" value="55"></div></div>
<div class="row"><div class="field"><label for="ratio">画幅</label><select id="ratio"><option value="9:16">竖屏 9:16（抖音）</option><option value="16:9">横屏 16:9（外网）</option><option value="1:1">方形 1:1</option></select></div><div class="field"><label for="speed">旁白语速</label><select id="speed"><option value="0.82">舒缓</option><option value="0.92" selected>标准</option><option value="1.05">稍快</option></select></div></div>
<div class="field"><label for="music">项目配乐（可选）</label><input id="music" type="file" accept="audio/*"></div>
<div class="btns"><button id="analyze" class="btn primary">① 自动拆章节与分镜</button><button id="characters" class="btn">人物卡片</button></div>
<div class="hint" style="margin-top:9px">仅使用浏览器本地处理。人物生成、自然配音和AI画面生成需要后续接入付费模型；先使用文字分镜和本地素材即可开始制作。</div>
</div>
</aside>
<section class="right">
<div class="panel preview"><div class="preview-head"><div><div class="eyebrow">成片预览</div><strong id="previewTitle">未生成分镜</strong></div><span class="badge" id="status">等待导入小说</span></div><div class="stage" id="stage"><div style="text-align:center;color:#95a2b8"><div style="font-size:34px;color:#b7adff">✦</div>粘贴小说后开始自动拆分</div></div><div class="controls"><div class="meter"><i id="meter"></i></div><button id="speak" class="btn">播放旁白</button><button id="stop" class="btn">停止</button><button id="export" class="btn primary">导出当前分集（WebM）</button></div></div>
<div class="panel chapters"><div class="chap-head"><div><div class="eyebrow">分集与分镜</div><strong id="chapterTitle">还没有生成章节</strong></div><button id="copyJson" class="btn">导出剧本数据</button></div><div class="workspace"><div><div class="eyebrow">章节 / 镜头</div><div class="list" id="chapterList"><div class="hint">完成拆分后，这里将显示每一集可编辑的镜头。</div></div></div><div class="card"><div class="eyebrow">人物一致性卡片</div><h3 style="margin:5px 0 8px">人物档案</h3><div class="character-list" id="characterList"><div class="hint">分析小说后自动识别常见人名。</div></div></div></div></div>
</section>
</main>
<div class="modal" id="modal"><div class="panel dialog"><div style="display:flex;justify-content:space-between"><div><div class="eyebrow">剧本与人物说明</div><h2>可编辑人物卡片</h2></div><button id="close" class="btn">关闭</button></div><textarea id="characterPrompt" style="min-height:220px" class="mono"></textarea><div class="hint">将人物卡片作为后续AI模型的角色参考提示词，可保持服装、脸型、发色和年龄在镜头间一致。</div></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');let chapters=[],characters=[],currentChapter=0,currentScene=0,playing=false,timer=null,rec=null,recorded=[],exportRunning=false;
function splitText(text){let by=/^\s*(第.+?[章节回部篇集])\s*[:：]?\s*(.*)$/gm;let matches=[...text.matchAll(by)],out=[];if(matches.length){let cursor=0;matches.forEach((m,i)=>{if(i===0&&m.index>0){const pre=text.slice(0,m.index).trim();if(pre)out.push({title:'前言',text:pre})}out.push({title:(m[1]+(m[2]?('：'+m[2]):'')).trim(),text:''});cursor=m.index+m[0].length;if(i<matches.length-1){const next=matches[i+1].index;out[out.length-1].text=text.slice(cursor,next).trim();cursor=next}else{out[out.length-1].text=text.slice(cursor).trim()}})}else{const size=+$('#chapterSize').value||900;for(let i=0;i<text.length;i+=size)out.push({title:`第${out.length+1}集`,text:text.slice(i,i+size).trim()})}return out.filter(x=>x.text||x.title)}
function sentenceSplit(text,max){const raw=text.replace(/\r/g,'').split(/(?<=[。！？!?；])|\n+/).map(x=>x.trim()).filter(Boolean),out=[];let cur='';for(const s of raw){if(cur.length+s.length>max&&cur){out.push(cur);cur=s}else cur+=(cur?' ':'')+s}if(cur)out.push(cur);return out.length?out:[text].filter(Boolean)}
function detectNames(text){const words=[...new Set((text.match(/[\u4e00-\u9fa5]{2,4}(?=[：，。！？说问喊道回望停走坐站笑哭点头叫])/g)||[]).map(x=>x.trim()))];const extra=['林岚','主角','男主角','女主角'];return [...new Set([...words,...extra].slice(0,6))].filter((x,i,a)=>a.indexOf(x)===i).map((name,i)=>({name,role:i===0?'主角':'角色',face:['👩🏻','🧑🏻','🧔🏻','👩🏽','🧑🏽‍🦱','🧑🏼'][i%6],description:`${name}，保持人物脸型、发色、年龄、服装与镜头之间一致。`}))}
function analyze(){const text=$('#novel').value.trim();if(text.length<20){alert('请先粘贴小说正文。');return}const split=splitText(text),sceneSize=+$('#sceneSize').value||55;chapters=split.map((c,i)=>({title:c.title||`第${i+1}集`,scenes:sentenceSplit(c.text,sceneSize).map((caption,j)=>({caption,seconds:Math.max(3,Math.min(9,caption.length/5))})),characters:[]}));characters=detectNames(text);renderChars();renderChapters();currentChapter=0;currentScene=0;drawScene();$('#status').textContent='分集完成';$('#previewTitle').textContent=$('#project').value+' · '+(chapters[0]?.title||'');$('#chapterTitle').textContent=`共 ${chapters.length} 集 · 共 ${chapters.reduce((n,c)=>n+c.scenes.length,0)} 镜头`}
function renderChars(){const el=$('#characterList');el.innerHTML=characters.map((c,i)=>`<div class="character"><div class="face">${c.face}</div><input value="${escape(c.name)}" data-name="${i}" aria-label="人物名称"></div>`).join('');el.querySelectorAll('[data-name]').forEach(i=>i.oninput=()=>characters[+i.dataset.name].name=i.value);}
function renderChapters(){const el=$('#chapterList');el.innerHTML=chapters.map((c,i)=>`<div class="chapter ${i===currentChapter?'active':''}" data-i="${i}"><div class="num">${i+1}</div><div><input value="${escape(c.title)}" data-title="${i}"><small>${c.scenes.length} 镜头 · 约 ${Math.round(c.scenes.reduce((n,s)=>n+s.seconds,0))} 秒</small></div><button class="trash" data-remove="${i}" title="删除分集">删除</button></div>`).join('');el.querySelectorAll('[data-title]').forEach(i=>i.onchange=()=>chapters[+i.dataset.title].title=i.value);el.querySelectorAll('[data-remove]').forEach(i=>i.onclick=()=>{chapters.splice(+i.dataset.remove,1);renderChapters();updateCount()});el.querySelectorAll('[data-i]').forEach(i=>i.onclick=e=>{if(e.target.matches('input,button'))return;currentChapter=+i.dataset.i;currentScene=0;renderChapters();drawScene();$('#previewTitle').textContent=$('#project').value+' · '+chapters[currentChapter]?.title});}
function updateCount(){const n=chapters.reduce((x,c)=>x+c.scenes.length,0);$('#chapterTitle').textContent=`共 ${chapters.length} 集 · 共 ${n} 镜头`}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fit(text,max=26){const out=[];let line='';for(const ch of text){line+=ch;if(line.length>=max){out.push(line);line=''}}if(line)out.push(line);return out.slice(0,3)}
function setupCanvas(){canvas.width=1280;canvas.height=$('#ratio').value==='9:16'?1920:$('#ratio').value==='1:1'?1280:720;canvas.style.aspectRatio=canvas.width+'/'+canvas.height}
function drawScene(){setupCanvas();const stage=$('#stage');const c=chapters[currentChapter]?.scenes[currentScene];ctx.clearRect(0,0,canvas.width,canvas.height);const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);g.addColorStop(0,'#20274b');g.addColorStop(.55,'#183c49');g.addColorStop(1,'#0b0e1c');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ffffff12';ctx.beginPath();ctx.arc(canvas.width*.72,canvas.height*.26,canvas.width*.24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c4baff';ctx.textAlign='center';ctx.font=`bold ${canvas.width*.07}px system-ui`;ctx.fillText(characters[0]?.face||'📖',canvas.width*.72,canvas.height*.34);ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font=`bold ${canvas.width*.024}px system-ui`;ctx.fillText((chapters[currentChapter]?.title||'故事分镜'),canvas.width*.055,canvas.height*.08);ctx.fillStyle='#d0d7e9';ctx.font=`${canvas.width*.018}px system-ui`;ctx.fillText(`镜头 ${currentScene+1} · ${characters[0]?.name||'主角'}`,canvas.width*.055,canvas.height*.125);const lines=fit(c?.caption||'等待生成分镜',canvas.width<800?21:34);ctx.textAlign='center';ctx.font=`bold ${canvas.width*.035}px system-ui,"Microsoft YaHei"`;ctx.lineWidth=canvas.width*.006;ctx.strokeStyle='#080b12';lines.forEach((line,i)=>{const y=canvas.height*.78+(i-(lines.length-1)/2)*canvas.width*.045;ctx.strokeText(line,canvas.width/2,y);ctx.fillStyle='#fff';ctx.fillText(line,canvas.width/2,y)});ctx.textAlign='left';ctx.fillStyle='#d7d0ff';ctx.font=`${canvas.width*.018}px system-ui`;ctx.fillText(`${$('#project').value} · ${characters.map(x=>x.name).filter(Boolean).slice(0,3).join(' / ')}`,canvas.width*.055,canvas.height*.94);if(stage.firstChild!==canvas){stage.innerHTML='';stage.appendChild(canvas)}if(c)$('#status').textContent=`第 ${currentChapter+1} 集 · 镜头 ${currentScene+1}/${chapters[currentChapter].scenes.length}`}
function stop(){playing=false;if(timer){clearInterval(timer);timer=null}speechSynthesis?.cancel();$('#status').textContent='已停止'}
function speak(){if(!chapters.length)return;if(!('speechSynthesis'in window)){alert('浏览器不支持语音朗读，请使用最新版 Edge 或 Chrome。');return}stop();const c=chapters[currentChapter].scenes[currentScene];const u=new SpeechSynthesisUtterance(c.caption);u.lang='zh-CN';u.rate=+$('#speed').value;speechSynthesis.speak(u);$('#status').textContent='正在朗读当前镜头'}
function preview(){if(!chapters.length){alert('请先拆章节与分镜。');return}stop();playing=true;let elapsed=0;currentScene=0;drawScene();const ch=chapters[currentChapter];timer=setInterval(()=>{const s=ch.scenes[currentScene];if(!s){stop();return}drawScene();elapsed+=.1;const total=ch.scenes.reduce((n,x)=>n+x.seconds,0),progress=(elapsed/total)*100;$('#meter').style.width=Math.min(100,progress)+'%';if(elapsed>ch.scenes.slice(0,currentScene+1).reduce((n,x)=>n+x.seconds,0)){currentScene++;if(currentScene>=ch.scenes.length){stop();$('#meter').style.width='100%';return}else drawScene()}},100);$('#status').textContent='分镜预览播放中'}
async function exportVideo(){if(!chapters.length){alert('请先拆章节与分镜。');return}if(!canvas.captureStream||!window.MediaRecorder){alert('当前浏览器不支持导出，请使用最新版 Edge 或 Chrome。');return}const ch=chapters[currentChapter],stream=canvas.captureStream(24);let audioNodes=[];try{const mf=$('#music').files[0];if(mf){const ac=new(AudioContext||webkitAudioContext),dest=ac.createMediaStreamDestination(),el=new Audio(URL.createObjectURL(mf));el.loop=true;el.volume=.22;await ac.resume();ac.createMediaElementSource(el).connect(dest);el.play().catch(()=>{});dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));audioNodes=[ac,el]}}catch{}recorded=[];const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';rec=new MediaRecorder(stream,{mimeType:mime});rec.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};rec.onstop=()=>{const blob=new Blob(recorded,{type:'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=($('#project').value||'小说短剧')+'-'+(ch.title||'分集')+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('#export').disabled=false;$('#status').textContent='导出完成';if(audioNodes[1])audioNodes[1].pause();if(audioNodes[0])audioNodes[0].close()};$('#export').disabled=true;rec.start(250);let i=0,start=performance.now(),total=ch.scenes.reduce((n,x)=>n+x.seconds,0);const run=()=>{if(i>=ch.scenes.length){rec.stop();return}currentScene=i;drawScene();const begin=performance.now();const frame=()=>{drawScene();$('#meter').style.width=Math.min(100,(performance.now()-start)/(total*1000)*100+'%');if(performance.now()-begin>=ch.scenes[i].seconds*1000){i++;run()}else requestAnimationFrame(frame)};requestAnimationFrame(frame)};run()}
$('#analyze').onclick=analyze;$('#characters').onclick=()=>{$('#characterPrompt').value=characters.map(c=>`${c.name}：${c.description}`).join('\n\n')||'尚未识别人物，请先拆分小说。';$('#modal').classList.add('show')};$('#close').onclick=()=>$('#modal').classList.remove('show');$('#speak').onclick=speak;$('#stop').onclick=stop;$('#export').onclick=exportVideo;$('#copyJson').onclick=()=>{const data={project:$('#project').value,ratio:$('#ratio').value,characters,chapters};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='novel-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)};$('#ratio').onchange=drawScene;
})();
</script>
</body>
</html>
